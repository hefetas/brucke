<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="İngilizce ve Almanca için kişisel çalışma sitesi">

<style>
/* Layout idea: a left rail of skills, one working column, language mode recolours the whole page (cobalt for English, ochre for Deutsch). */
:root{
  --bg:#F1F4F8; --surface:#FFFFFF; --surface-2:#E8EDF4; --ink:#0F1C2E; --ink-2:#4A5A72; --line:#D3DBE7;
  --en:#1F44C8; --en-soft:#E0E7FB; --de:#97590A; --de-soft:#FAE9CB; --on-accent:#FFFFFF;
  --good:#17794A; --good-soft:#DCF2E6; --bad:#B3261E; --bad-soft:#FBE2E0; --warn:#8A5A00; --warn-soft:#FBEFD2;
  --g-der:#2750CC; --g-die:#BE1F5A; --g-das:#12805A;
  --accent:var(--en); --accent-soft:var(--en-soft);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-read:'Newsreader',Georgia,'Times New Roman',serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
:root[data-mode="de"]{--accent:var(--de);--accent-soft:var(--de-soft)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1420; --surface:#132033; --surface-2:#1B2B42; --ink:#E7EDF6; --ink-2:#9BABC2; --line:#27374D;
    --en:#86A3FF; --en-soft:#1B2A55; --de:#F2B552; --de-soft:#3B2C10; --on-accent:#0B1420;
    --good:#58D08F; --good-soft:#12301F; --bad:#FF8F86; --bad-soft:#3A1816; --warn:#F2B552; --warn-soft:#3B2C10;
    --g-der:#8CABFF; --g-die:#FF8FB8; --g-das:#6FDBA8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1420; --surface:#132033; --surface-2:#1B2B42; --ink:#E7EDF6; --ink-2:#9BABC2; --line:#27374D;
  --en:#86A3FF; --en-soft:#1B2A55; --de:#F2B552; --de-soft:#3B2C10; --on-accent:#0B1420;
  --good:#58D08F; --good-soft:#12301F; --bad:#FF8F86; --bad-soft:#3A1816; --warn:#F2B552; --warn-soft:#3B2C10;
  --g-der:#8CABFF; --g-die:#FF8FB8; --g-das:#6FDBA8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4.4vw,2.7rem);font-weight:700}
h2{font-size:1.35rem;font-weight:650}
h3{font-size:1.05rem;font-weight:650}
p{margin:0 0 .8em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.muted{color:var(--ink-2)}
.hint{font-size:.82rem;color:var(--ink-2);display:block}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.read{font-family:var(--font-read);font-size:1.18rem;line-height:1.7;max-width:62ch}
.hide{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:750;font-size:1.35rem;letter-spacing:-.02em;margin-right:auto;text-decoration:none;color:var(--ink)}
.brand svg{width:28px;height:28px;color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.ibtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

/* shell */
.shell{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;padding-top:24px}
.nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(72px + env(safe-area-inset-top,0px));align-self:start}
.nav a{display:flex;flex-direction:column;padding:8px 12px;text-decoration:none;color:var(--ink-2);border-left:3px solid transparent;border-radius:0 8px 8px 0;font-weight:600;line-height:1.2}
.nav a small{font-weight:400;font-size:.76rem;opacity:.85}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{color:var(--ink);border-left-color:var(--accent);background:var(--accent-soft)}
.main{min-width:0}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:12px}
  .nav{flex-direction:row;overflow-x:auto;position:static;gap:6px;padding-bottom:6px;scrollbar-width:thin}
  .nav a{border-left:0;border-bottom:3px solid transparent;border-radius:8px 8px 0 0;white-space:nowrap;padding:8px 12px}
  .nav a small{display:none}
  .nav a[aria-current="page"]{border-bottom-color:var(--accent)}
}

/* structure */
.page-head{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.page-head .hint{font-size:.95rem}
.sec{margin-top:30px}
.sec>h2{margin-bottom:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel.flat{background:transparent}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:12px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 11px;font-size:.88rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.inp,.sel,.area{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.inp:focus,.sel:focus,.area:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.area{min-height:220px;resize:vertical;font-family:var(--font-read);font-size:1.1rem;line-height:1.6}
.inp.gap{display:inline-block;width:9.5em;padding:3px 8px;margin:0 3px;vertical-align:baseline}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--surface-2);font-size:.82rem;font-weight:600;color:var(--ink-2)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meter{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .3s}
.meter.good>i{background:var(--good)}

/* today */
.bridge{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px 14px;align-items:center;padding:22px 20px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.bridge .w{font-family:var(--font-display);font-size:clamp(1.3rem,3.2vw,1.9rem);font-weight:650;line-height:1.15;overflow-wrap:anywhere}
.bridge .w small{display:block;font-family:var(--font-body);font-size:.74rem;font-weight:500;color:var(--ink-2);letter-spacing:.04em;margin-bottom:2px}
.bridge .arch{width:56px;height:20px;color:var(--accent)}
@media (max-width:640px){.bridge{grid-template-columns:1fr}.bridge .arch,.bridge .sp{display:none}}
.strand{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:6px 16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.strand:first-of-type{border-top:0}
.strand h3{font-size:1rem}
@media (max-width:640px){.strand{grid-template-columns:1fr}}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--font-display);font-size:2rem;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:.84rem;color:var(--ink-2)}

/* words / srs */
.flash{max-width:640px;margin:0 auto}
.flash .prompt{font-family:var(--font-display);font-size:clamp(1.6rem,4.6vw,2.4rem);font-weight:650;margin:10px 0 4px;overflow-wrap:anywhere}
.flash .sub{color:var(--ink-2)}
.answer-big{font-family:var(--font-display);font-size:1.9rem;font-weight:700;overflow-wrap:anywhere}
.g-der{color:var(--g-der)}.g-die{color:var(--g-die)}.g-das{color:var(--g-das)}
.art{display:inline-block;padding:0 8px;border-radius:6px;font-weight:700;margin-right:4px}
.art.der{background:color-mix(in srgb,var(--g-der) 15%,transparent);color:var(--g-der)}
.art.die{background:color-mix(in srgb,var(--g-die) 15%,transparent);color:var(--g-die)}
.art.das{background:color-mix(in srgb,var(--g-das) 15%,transparent);color:var(--g-das)}
.verdict{padding:12px 14px;border-radius:10px;font-weight:600}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.verdict.mid{background:var(--warn-soft);color:var(--warn)}
.ex{font-family:var(--font-read);font-size:1.15rem;font-style:italic}
.wlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
@media (max-width:720px){.wlist{grid-template-columns:minmax(0,1fr)}}
.wrow{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.wrow .t{margin-left:auto;color:var(--ink-2);text-align:right;font-size:.9rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.b1{background:var(--bad)}.dot.b2{background:var(--warn)}.dot.b3{background:var(--accent)}.dot.b5{background:var(--good)}

/* grammar */
.rule{border-left:3px solid var(--accent);padding:6px 0 6px 14px;margin:12px 0;font-family:var(--font-read);font-size:1.15rem}
.rule div+div{margin-top:4px}
.item{padding:12px 0;border-top:1px solid var(--line);line-height:2.1}
.item .why{display:block;line-height:1.5;font-size:.92rem;margin-top:4px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.item.ok .why{background:var(--good-soft);color:var(--good)}
.item.no .why{background:var(--bad-soft)}
.item .why b{color:var(--ink)}
code{font-family:var(--font-mono);font-size:.88em;background:var(--surface-2);padding:1px 6px;border-radius:5px}
.trnote{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:.97rem}

/* reading */
.gl{border-bottom:2px dotted var(--accent);cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;padding:0;font:inherit;color:inherit}
.gl:hover,.gl.on{background:var(--accent-soft)}
.glbar{position:sticky;bottom:12px;margin-top:14px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.glbar .btn{background:var(--bg);color:var(--ink);border-color:transparent}
.q{padding:14px 0;border-top:1px solid var(--line)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.opt:hover{background:var(--surface-2)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.rlist{display:flex;flex-direction:column}
.ritem{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer;width:100%}
.ritem:hover h3{color:var(--accent)}

/* listening / diff */
.diff span{padding:1px 3px;border-radius:4px;margin-right:2px}
.diff .ok{background:var(--good-soft);color:var(--good)}
.diff .miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}
.diff .extra{background:var(--warn-soft);color:var(--warn);text-decoration:line-through}
.big-time{font-family:var(--font-mono);font-size:clamp(2.4rem,9vw,4rem);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cue{border:2px solid var(--ink);border-radius:6px;padding:16px 20px;font-family:var(--font-read);font-size:1.15rem;max-width:560px}
.cue ul{margin:8px 0 0;padding-left:20px}
.rate{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rate button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.rate button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding:4px 2px}
.msg{padding:10px 14px;border-radius:14px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent)}
.msg.ai{align-self:flex-start;background:var(--surface-2)}

/* tables & prose pages */
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--font-display);font-weight:650}
.scroll-x{overflow-x:auto}
.prose{max-width:68ch}
.prose h3{margin:22px 0 6px}
.prose li{margin-bottom:4px}
.ref{font-size:.88rem;color:var(--ink-2)}
.principle{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:6px 28px;padding:20px 0;border-top:1px solid var(--line)}
@media (max-width:720px){.principle{grid-template-columns:minmax(0,1fr)}}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bars .col{flex:1;display:flex;flex-direction:column-reverse;min-width:0;height:100%;justify-content:flex-start;border-bottom:1px solid var(--line)}
.bars .col i{display:block;width:100%}
.bars .lab{font-size:.7rem;color:var(--ink-2);text-align:center;margin-top:4px}
.s-f{background:var(--accent)}.s-i{background:var(--good)}.s-o{background:var(--warn)}.s-u{background:var(--g-die)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-weight:600;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ===== CONTENT ===== */
/* All practice material below is original. Exam names belong to their owners. */

// English vocabulary: word|pos|definition|turkish|example
const RAW_EN = `mitigate|verb|make something less severe or harmful|hafifletmek|Governments try to mitigate the effects of climate change.
allocate|verb|give resources for a particular purpose|tahsis etmek|The city allocated more money to public transport.
consequently|adverb|as a result|sonuç olarak|The factory closed; consequently, hundreds lost their jobs.
substantial|adjective|large in amount or importance|büyük, önemli|There has been a substantial rise in rents.
undermine|verb|weaken something gradually|zayıflatmak, baltalamak|Constant criticism can undermine confidence.
elaborate|verb|explain in more detail|ayrıntılandırmak|Could you elaborate on your second point?
inevitable|adjective|impossible to avoid|kaçınılmaz|Some delays are inevitable on long projects.
reluctant|adjective|unwilling and hesitant|isteksiz|He was reluctant to change his plans.
widespread|adjective|found over a large area or among many people|yaygın|Fake news is a widespread problem.
coincide|verb|happen at the same time|aynı zamana denk gelmek|The launch coincided with a national holiday.
outweigh|verb|be greater in importance than|ağır basmak|For many people the benefits outweigh the risks.
reinforce|verb|make stronger|pekiştirmek|Repetition reinforces memory.
comprehensive|adjective|including everything necessary|kapsamlı|The report gives a comprehensive overview.
deteriorate|verb|become worse|kötüleşmek|Her health deteriorated rapidly.
feasible|adjective|possible and practical|uygulanabilir|Is it feasible to finish by Friday?
hypothesis|noun|an idea that is proposed so it can be tested|hipotez|The results support our hypothesis.
obsolete|adjective|no longer used because something better exists|modası geçmiş|Many typewriters are now obsolete.
prevalent|adjective|common at a particular time or place|yaygın, hâkim|Obesity is increasingly prevalent.
scarce|adjective|not enough in supply|kıt|Water is scarce in many regions.
trigger|verb|cause something to start|tetiklemek|The announcement triggered protests.
viable|adjective|able to work successfully|uygulanabilir, yaşayabilir|Solar power is now a viable option.
endorse|verb|publicly support|desteklemek, onaylamak|Several doctors endorsed the new method.
distinguish|verb|recognise the difference between things|ayırt etmek|It is hard to distinguish the twins.
contradict|verb|say or be the opposite of|çelişmek|His statement contradicts the evidence.
compensate|verb|make up for a loss or problem|telafi etmek|Extra pay cannot compensate for long hours.
emerge|verb|come out or become known|ortaya çıkmak|New problems emerged during testing.
pursue|verb|try to achieve over time|peşinden gitmek, sürdürmek|She decided to pursue a career in engineering.
sustain|verb|keep going over a long time|sürdürmek|It is hard to sustain growth for decades.
drawback|noun|a disadvantage|dezavantaj|The main drawback is the cost.
bias|noun|an unfair preference for one side|önyargı, yanlılık|The study found gender bias in hiring.
incentive|noun|something that motivates action|teşvik|Tax incentives encourage firms to invest.
spectrum|noun|a range of different things|yelpaze|Opinions cover a wide spectrum.
implement|verb|put a plan into action|uygulamak, hayata geçirmek|The school implemented a new timetable.
thorough|adjective|complete and careful|titiz, kapsamlı|We carried out a thorough investigation.
vulnerable|adjective|easily harmed or hurt|savunmasız|Older people are more vulnerable to heat.
acknowledge|verb|accept that something is true|kabul etmek|He acknowledged his mistake.
plausible|adjective|reasonable and likely to be true|makul, inandırıcı|That is a plausible explanation.
arbitrary|adjective|based on chance rather than reason|keyfi|The rules seem arbitrary.
disparity|noun|a large and unfair difference|eşitsizlik, fark|There is a disparity in pay between regions.
tackle|verb|try to deal with a problem|ele almak, başa çıkmak|We must tackle unemployment.
cumulative|adjective|growing by successive additions|birikimli|The cumulative effect of small savings is large.
hinder|verb|make something difficult to do|engellemek, zorlaştırmak|Poor roads hinder trade.
prominent|adjective|important or well known|önde gelen|A prominent scientist gave the talk.
render|verb|cause to become|(bir hale) getirmek|The storm rendered the road impassable.
notion|noun|an idea or belief|kavram, fikir|The notion of free time is changing.

function parseEN(){
  return RAW_EN.split('\n').map(l=>{ const p=l.split('|'); return {id:'en:'+p[0], lang:'en', word:p[0], answer:p[0], pos:p[1], def:p[2], tr:p[3], ex:p[4]}; });
}
function parseDE(){
  return RAW_DE.split('\n').map(l=>{ const p=l.split('|'); const art=p[0]; const word=p[1];
    const pos = art ? 'isim' : (p[2] ? 'fiil' : 'diğer');
    return {id:'de:'+(art?art+' ':'')+word, lang:'de', art, word, answer:(art?art+' ':'')+word, pos, forms:p[2], tr:p[3], ex:p[4]}; });
}

  const el = document.createElement(tag);
  if (props) for (const k of Object.keys(props)){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'for') el.htmlFor = v;
    else if (k.slice(0,2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'style') el.style.cssText = v;
    else if (k in el && k !== 'list') { try { el[k] = v; } catch(e){ el.setAttribute(k, v); } }
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));

function initStandalone(){
  standalone = true;

    a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);

    const msgs = typeof input === 'string' ? [{role:'user', content:input}] : input;
    const body = { contents: msgs.map(m => ({role: m.role === 'assistant' ? 'model' : 'user', parts:[{text:m.content}]})) };
    if (json) body.generationConfig = {responseMimeType:'application/json'};
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(c.model || 'gemini-3.6-flash') + ':generateContent', {
      method:'POST', headers:{'Content-Type':'application/json', 'x-goog-api-key': c.key}, body: JSON.stringify(body)});
    if (r.status === 429) throw {code:'rate_limited'};
    if (r.status === 400 || r.status === 403 || r.status === 404) throw {code:'bad_key'};
    if (!r.ok) throw {code:'net'};
    const j = await r.json();
    const t = (((j.candidates || [])[0] || {}).content || {}).parts;
    return (t || []).map(x => x.text || '').join('');

const LANGCODE = () => S.mode === 'en' ? S.accent : 'de-DE';
function pickVoice(lang){
  if (!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices();
  const pre = lang.slice(0,2);
  const exact = vs.filter(v => v.lang.replace('_','-') === lang);
  const loose = vs.filter(v => v.lang.slice(0,2) === pre);
  const pool = exact.length ? exact : loose;
  return pool.find(v => /natural|google|premium|enhanced/i.test(v.name)) || pool[0] || null;
}
function speak(text, rate, lang){
  if (!('speechSynthesis' in window)){ toast('Bu tarayıcıda sesli okuma yok.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || LANGCODE(); u.rate = rate || 1;
  const v = pickVoice(u.lang); if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function speakBtn(text, label, rate){

/* ---------- text matching ---------- */
function fold(s){ return s.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss'); }
function norm(s){
  s = String(s).toLowerCase().replace(/[’`´]/g,"'").replace(/[.,;:!?"“”()]/g,' ').replace(/\s+/g,' ').trim();
  return S.mode === 'de' ? fold(s) : s;
}
function lev(a, b){
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length:n+1}, (_,i) => i);
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function diffWords(ref, hyp){
  const clean = w => norm(w.replace(/[^\p{L}\p{N}'’-]/gu,''));
  const a = ref.trim().split(/\s+/), b = hyp.trim() ? hyp.trim().split(/\s+/) : [];
  const na = a.map(clean), nb = b.map(clean);
  const dp = Array.from({length:a.length+1}, () => new Array(b.length+1).fill(0));
  for (let i = a.length-1; i >= 0; i--) for (let j = b.length-1; j >= 0; j--)
    dp[i][j] = na[i] === nb[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const parts = []; let i = 0, j = 0, ok = 0;
  while (i < a.length || j < b.length){
    if (i < a.length && j < b.length && na[i] === nb[j]){ parts.push({t:a[i], k:'ok'}); ok++; i++; j++; }
    else if (j < b.length && (i >= a.length || dp[i][j+1] >= dp[i+1][j])){ parts.push({t:b[j], k:'extra'}); j++; }
    else { parts.push({t:a[i], k:'miss'}); i++; }
  }
  return {parts, acc: a.length ? ok / a.length : 0};
}

const okStr = (x, n) => typeof x === 'string' && x.trim() && x.length <= (n || 300) && !/[|\n]/.test(x);
async function loadDaily(){
  try {
    const r = await fetch('daily.json?d=' + ymd(), {cache:'no-store'}); if (!r.ok) return;
    const j = await r.json(); let added = 0;
    for (const m of ['en', 'de']){
      const g = j && j[m]; if (!g) continue;
      const have = new Set(DECK_EN.concat(DECK_DE, EXTRA.en, EXTRA.de).map(c => c.id));
      for (const w of (Array.isArray(g.words) ? g.words : [])){
        if (!w || !okStr(w.word, 60) || !okStr(w.tr) || !okStr(w.ex, 400)) continue;
        let c;
        if (m === 'en'){ if (!okStr(w.pos, 30) || !okStr(w.def, 300)) continue; c = {id:'en:' + w.word, lang:'en', word:w.word, answer:w.word, pos:w.pos, def:w.def, tr:w.tr, ex:w.ex, ai:true}; }
        else {
          const art = ['der', 'die', 'das'].includes(w.art) ? w.art : '';
          c = {id:'de:' + (art ? art + ' ' : '') + w.word, lang:'de', art, word:w.word, answer:(art ? art + ' ' : '') + w.word, pos: art ? 'isim' : (w.forms ? 'fiil' : 'diğer'), forms: typeof w.forms === 'string' ? w.forms : '', tr:w.tr, ex:w.ex, ai:true};
        }
        if (have.has(c.id)) continue; have.add(c.id); EXTRA[m].push(c); added++;
      }
      for (const t of (Array.isArray(g.readings) ? g.readings : [])){
        if (!t || !okStr(t.id, 60) || !okStr(t.title, 120) || !Array.isArray(t.paras) || !t.paras.length || !Array.isArray(t.qs)) continue;
        if (READINGS[m].some(x => x.id === t.id)) continue;
        const qs = t.qs.filter(q => Array.isArray(q) && typeof q[0] === 'string' && Array.isArray(q[1]) && q[1].length >= 2 && Number.isInteger(q[2]) && q[2] >= 0 && q[2] < q[1].length && typeof q[3] === 'string');
        if (!qs.length) continue;
        READINGS[m].push({id:t.id, level:String(t.level || ''), title:t.title, minutes:Math.max(1, Math.min(15, +t.minutes || 3)), paras:t.paras.map(String), qs, ai:true}); added++;
      }
      for (const d of (Array.isArray(g.dict) ? g.dict : [])) if (typeof d === 'string' && d.length < 300 && !DICT[m].includes(d)){ DICT[m].push(d); added++; }
    }
    if (added) renderView();
  } catch(e){}
}
const IVL = [0, 1, 3, 7, 16, 35, 80, 160];
function newAvail(){
  const t = ymd();
  if (S.newToday.d !== t) S.newToday = {d:t, en:0, de:0};
  return Math.max(0, S.newPerDay - S.newToday[S.mode]);
}
function deckStats(mode){
  const d = deck(mode), now = Date.now(); let due = 0, nw = 0, learned = 0; const boxes = new Array(8).fill(0);
  for (const c of d){
    const s = S.cards[c.id];
    if (!s){ nw++; continue; }
    boxes[s.box]++; if (s.due <= now) due++; if (s.box >= 3) learned++;
  }
  return {total:d.length, due, nw, learned, boxes};
}
function srsUpdate(id, ok, hinted){
  const s = S.cards[id] || (S.cards[id] = {box:0, due:0, reps:0, lapses:0});
  if (ok && !hinted){ s.box = Math.min(7, s.box + 1); s.reps++; }
  else if (ok){ s.box = Math.max(1, s.box); }
  else { s.box = Math.max(1, Math.floor(s.box / 2)); s.lapses++; }
  const jitter = 1 + (Math.random() * 0.2 - 0.1);
  s.due = ok ? Date.now() + Math.max(1, IVL[s.box]) * 864e5 * jitter : Date.now() + 10 * 60 * 1000;
  s.last = Date.now();
}
function checkAnswer(c, input){
  const n = norm(input), e = norm(c.answer);
  if (!n) return {ok:false};
  if (n === e) return {ok:true};
  if (c.lang === 'de' && c.art){
    const bare = norm(c.word);
    if (n === bare) return {ok:false, note:'noart'};
    if (n.replace(/^(der|die|das) /,'') === bare) return {ok:false, note:'wrongart'};
  }
  if (e.length >= 6 && lev(n, e) <= 1) return {ok:true, typo:true};
  return {ok:false};
}
function artSpan(c){
  return c.art ? [h('span', {class:'art ' + c.art}, c.art), c.word] : [c.word];
}

function addCustom(o){

function startSession(practice){
  const d = deck(), now = Date.now();
  let queue;
  if (practice){
    queue = shuffle(d.filter(c => S.cards[c.id])).slice(0, 10).map(c => ({c, intro:false}));
  } else {
    const due = [], nw = [];
    for (const c of d){ const s = S.cards[c.id]; if (!s) nw.push(c); else if (s.due <= now) due.push({c, intro:false}); }
    due.sort((a,b) => S.cards[a.c.id].due - S.cards[b.c.id].due);
    queue = shuffle(due.slice(0, 30)).concat(shuffle(nw).slice(0, newAvail()).map(c => ({c, intro:true})));
  }
  ui.session = {queue, total:queue.length, practice, stage:'test', hinted:0, fb:null, ok:0, bad:0, missed:[]};
  renderView();
}

function nextCard(){
  const s = ui.session, it = s.queue[0], fb = s.fb, id = it.c.id;

      else srsUpdate(id, true, fb.hinted);
    } else if (!it.failed) srsUpdate(id, false, false);
  }
  log('f', 0.4);
  s.queue.shift();

  else { if (!it.failed){ s.bad++; s.missed.push({c:it.c, given:fb.given}); } it.failed = true; s.queue.splice(Math.min(3, s.queue.length), 0, it); }

const GL_RE = /\[\[([^|\]]+)\|([^|\]]+)(?:\|([^\]]+))?\]\]/g;
function parseGloss(text){
  const out = []; let last = 0, m; GL_RE.lastIndex = 0;
  while ((m = GL_RE.exec(text))){
    if (m.index > last) out.push(text.slice(last, m.index));
    out.push({w:m[1], tr:m[2], x:m[3] || ''}); last = GL_RE.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
const plainText = text => text.replace(GL_RE, '$1');

function beep(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext; const ctx = new AC();
    const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.08; o.start(); o.stop(ctx.currentTime + 0.18); setTimeout(() => ctx.close(), 500);
  } catch(e){}
}
function makeTimer(phases, onFinish){
  const label = h('span', {class:'chip accent'}, phases[0].label), disp = h('div', {class:'big-time', role:'timer'}, fmtTime(phases[0].sec));
  const btn = h('button', {class:'btn primary', type:'button'}, '▶ Start');
  let idx = 0, end = 0, iv = null, t0 = 0;
  function paint(){ disp.textContent = fmtTime(iv ? (end - Date.now()) / 1000 : phases[idx].sec); label.textContent = phases[idx].label; }
  function stop(done){
    clearInterval(iv); iv = null; btn.textContent = '▶ Start';
    const mins = t0 ? (Date.now() - t0) / 60000 : 0;
    if (done) onFinish(mins); else { idx = 0; paint(); }
  }
  function tick(){
    if (end - Date.now() <= 0){
      beep();
      if (idx < phases.length - 1){ idx++; end = Date.now() + phases[idx].sec * 1000; } else { stop(true); return; }
    }
    paint();
  }
  btn.addEventListener('click', () => {
    if (iv){ stop(false); return; }
    idx = 0; t0 = Date.now(); end = t0 + phases[0].sec * 1000; btn.textContent = '■ Stop';
    iv = setInterval(tick, 250); paint();
  });
  onLeave(() => clearInterval(iv));
  return h('div', {class:'stack', style:'align-items:flex-start'}, label, disp, btn);
}

    planOut.replaceChildren(
      h('div', null, 'Mevcut seviye ' + cur + ' → hedef ' + g.target + ': kabaca ' + need + ' saat çalışma gerekir (kişiden kişiye çok değişir).'),
      g.date ? h('div', null, Math.round(weeks) + ' hafta × ' + g.hours + ' saat = ' + Math.round(have) + ' saat. ' + (have >= need ? 'Süre yeterli görünüyor.' : 'Bu hızla ~' + Math.round(need - have) + ' saat eksik; haftalık süreyi veya tarihi gözden geçir.') ) : h('div', null, 'Bir sınav tarihi girersen süreyi karşılaştırırım.'),
      h('div', null, 'Haftalık ' + g.hours + ' saati dört şeride bölersen her biri ≈ ' + per + ' dk: kelime/dilbilgisi, okuma/dinleme, yazma/konuşma, akıcılık.'));
  }
  const lv = LVLS.slice(1).map(l => h('option', {value:l, selected:l === g.target}, l));
  el.append(h('div', {class:'sec'}, h('h2', null, T('Goal plan', 'Zielplan')), hint('Basit bir tahmin; seviye başına kaba saat değerlerine dayanır'),
    h('div', {class:'grid2'},
      h('div', null, h('label', {for:'gx', class:'muted'}, 'Sınav'), h('select', {class:'sel', id:'gx', onchange:e => { g.exam = e.target.value; save(); }}, exams.map(x => h('option', {value:x[0], selected:x[0] === g.exam}, x[1])))),
      h('div', null, h('label', {for:'gt', class:'muted'}, 'Hedef seviye'), h('select', {class:'sel', id:'gt', onchange:e => { g.target = e.target.value; save(); plan(); }}, lv)),
      h('div', null, h('label', {for:'gd', class:'muted'}, 'Sınav / hedef tarihi'), h('input', {class:'inp', id:'gd', type:'date', value:g.date, onchange:e => { g.date = e.target.value; save(); plan(); }})),
      h('div', null, h('label', {for:'gh', class:'muted'}, 'Haftalık saat'), h('input', {class:'inp', id:'gh', type:'number', min:1, max:40, value:g.hours, onchange:e => { g.hours = Math.max(1, Math.min(40, +e.target.value || 1)); save(); plan(); }}))),
    h('div', {style:'margin-top:12px'}, planOut)));
  plan();

  // backup
  const bk = h('div', {class:'stack'});
  const jsonBox = h('textarea', {class:'inp hide', rows:6, readOnly:true, 'aria-label':'Backup data'});
  const imp = h('input', {type:'file', accept:'.json,application/json', id:'imp', class:'hide', onchange:e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const o = JSON.parse(String(r.result)); if (!o || typeof o !== 'object' || !o.cards) throw new Error('bad'); S = Object.assign(defaults(), o); save(); toast('Yedek yüklendi'); shell(); } catch(err){ toast('Dosya okunamadı'); } };
    r.readAsText(f);
  }});
  const resetBtn = h('button', {class:'btn', type:'button'}, 'Tüm verileri sıfırla');
  resetBtn.addEventListener('click', () => {
    resetBtn.replaceWith(h('span', {class:'row'}, h('span', {class:'verdict no'}, 'Tüm ilerleme silinir. Emin misin?'),
      h('button', {class:'btn', type:'button', onclick:() => { S = defaults(); save(); shell(); location.hash = '#today'; }}, 'Evet, sil'),
      h('button', {class:'btn', type:'button', onclick:() => renderView()}, 'Vazgeç')));
  });
  bk.append(h('div', {class:'row'},
    h('button', {class:'btn', type:'button', onclick:async () => {
      const data = JSON.stringify(S, null, 1);
      if (dlFn){ try { await dlFn.save({filename:'brucke-yedek-' + ymd() + '.json', data}); } catch(e){} }
      else { jsonBox.classList.remove('hide'); jsonBox.value = data; jsonBox.select(); }
    }}, 'Yedeği indir'),
    h('button', {class:'btn', type:'button', onclick:() => imp.click()}, 'Yedekten yükle'), imp, resetBtn), jsonBox,
    h('p', {class:'hint'}, dbRef ? (syncOn ? 'Hesabınla otomatik eşitleme açık: ilerlemen diğer cihazlarında da görünür.' : 'Eşitleme bağlanıyor…') : 'İlerleme bu tarayıcıda saklanır. Cihaz değiştirirsen yedeği indirip yükle.'));
  el.append(h('div', {class:'sec'}, h('h2', null, 'Yedek ve eşitleme'), bk));
  if (standalone) el.append(h('p', {class:'hint'}, 'Günlük içerik (kelime, okuma metni, dikte) her sabah yapay zekâ ile üretilir; arada hata olabilir. Okuma metinlerinde "AI" etiketi görürsün.'));
  if (standalone){
    const c = aiCfg();
    const key = h('input', {class:'inp', type:'password', id:'aikey', placeholder:'Gemini API anahtarı', value:c.key || '', autocomplete:'off', 'aria-label':'Gemini API key'});
    const model = h('input', {class:'inp', type:'text', id:'aimodel', value:c.model || 'gemini-3.6-flash', 'aria-label':'Model'});
    el.append(h('div', {class:'sec'}, h('h2', null, 'Yapay zekâ (isteğe bağlı, ücretsiz)'),
      h('p', {class:'hint'}, 'Yazma geri bildirimi ve sohbet partneri için. Google AI Studio\'dan (aistudio.google.com) ücretsiz bir anahtar alıp buraya yapıştır. Anahtar yalnızca bu tarayıcıda saklanır, istekler doğrudan Google\'a gider. Ücretsiz kotanın kullanım koşullarını kendin kontrol et; model adı değişirse buradan güncelle.'),
      h('div', {class:'stack'}, key, model, h('div', {class:'row'},
        h('button', {class:'btn primary', type:'button', onclick:() => { setAiCfg({key:key.value.trim(), model:model.value.trim() || 'gemini-3.6-flash'}); toast('Kaydedildi'); }}, 'Kaydet'),
        h('button', {class:'btn', type:'button', onclick:() => { setAiCfg({}); key.value = ''; toast('Anahtar silindi'); }}, 'Anahtarı sil')))));
  }
  return el;
}

VIEWS.speak = viewSpeak; VIEWS.write = viewWrite; VIEWS.exams = viewExams; VIEWS.method = viewMethod; VIEWS.progress = viewProgress;

/* ---------- start ---------- */
shell();
initCaps().then(() => { if (standalone) loadDaily(); });
})();
</script>
</body></html>
