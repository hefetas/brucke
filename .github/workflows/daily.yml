name: Günlük içerik
on:
  schedule:
    - cron: '23 3 * * *'   # her gün 06:23 (Türkiye saati)
  workflow_dispatch: {}     # elle de çalıştırılabilir
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: İçerik üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/generate.mjs
      - name: Değişikliği kaydet
        run: |
          if [ -n "$(git status --porcelain daily.json)" ]; then
            git config user.name "brucke-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add daily.json
            git commit -m "Günlük içerik $(date -u +%F)"
            git push
          fi
